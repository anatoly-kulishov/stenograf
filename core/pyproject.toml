[project]
name = "stenograf-core"
description = "Локальное ядро Stenograf: GigaAM + диаризация"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jiwer>=4.0.0",
    "numpy>=2.5.4",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core==1.13.8",
    "soundfile>=0.14.0",
]

[project.scripts]
stenograf-core = "stenograf_core.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stenograf_core"]
